aid: ubs-bank-usa
name: UBS Bank USA
review:
  question: Does UBS Bank USA expose a documented first-party public developer API?
  answer: false
  date: '2026-07-23'
  reviewer: API Evangelist
findings:
  summary: |
    UBS Bank USA (BUSA) is a Utah state-chartered industrial bank and
    FDIC-insured depository institution in Salt Lake City, Utah, established
    2003 (~$122B total assets), and is the US banking entity of UBS Wealth
    Management Americas. It serves high-net-worth and ultra-high-net-worth
    advisory clients with FDIC-insured deposit sweeps, securities-based
    lending, mortgages, and credit cards delivered through UBS Financial
    Advisors. It is supervised by the FDIC, the Utah Department of Financial
    Institutions, and the CFPB.

    UBS Bank USA exposes NO first-party public developer API surface of its
    own. No US developer portal, API reference, or publicly downloadable
    OpenAPI/Swagger was found. The only live UBS developer portal,
    https://developer.ubs.com (HTTP 200), is operated by UBS Switzerland and
    serves Swiss/EU products (UBS key4 mortgages, QR-bill Portal API, PSD2,
    TWINT, bLink corporate cash management, KeyPort/EBICS, UBS Partner) — it
    does not serve the US BUSA entity and is recorded here only as the parent
    group's developer portal, not as a BUSA API surface.

    Open-finance posture: no documented FDX (Financial Data Exchange)
    participation for UBS Bank USA was found; UBS is not among the listed
    Akoya owner banks and no FDX-conformant BUSA data-access API is
    published. No BUSA-specific CFPB Section 1033 / Personal Financial Data
    Rights posture was located, though BUSA is CFPB-supervised and would fall
    in scope as the 1033 rule phases in. US consumer-permissioned data
    access, where available, is aggregator-mediated (Plaid / MX / Finicity /
    Akoya) rather than exposed via a documented first-party API. No
    authentication model (OAuth2/OIDC, API key, mTLS) applies because no
    first-party API is published.
  posture:
