actions:
  reason: |
    Honest identity-only (built-stub) record. UBS Bank USA has no first-party
    public API, no downloadable specs, no documented FDX/1033 posture, and its
    US data access is aggregator-mediated. No apis[] entries were fabricated;
    the live developer.ubs.com portal is recorded as the parent group's
    (UBS Switzerland) portal, clearly distinguished from the US entity.
